version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # TypeScript 7 has no JS API, which @vue/compiler-sfc needs to resolve imported prop types.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # nuxt-auth-utils 0.6 replaces NUXT_SESSION_PASSWORD with NUXT_APP_SECRET and logs every user out.
      - dependency-name: "nuxt-auth-utils"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      docs-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docs-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
